<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Short editorial 9x16 - contraste</title>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="templates/short-editorial-9x16/common.js"></script>
<script>const SCENE=__SCENE__;const CTX=__CTX__;ED.setup(CTX.fonts);</script>
<style>
#dark{position:absolute;inset:0;background:#141516;opacity:0;z-index:1}
#dark .grain{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff06 0 2px,transparent 2px 5px)}
#reveal{position:absolute;inset:0;z-index:2;clip-path:circle(0% at 50% 38%)}
#vwrap{left:90px;top:230px;width:900px;height:700px;border-radius:56px;z-index:3}
#seal{position:absolute;left:700px;top:150px;width:300px;height:300px;z-index:6;opacity:0}
#seal .disc{position:absolute;inset:52px;border-radius:50%;background:#00b3a0;box-shadow:0 18px 40px #00b3a066;display:flex;align-items:center;justify-content:center}
#seal svg.ring{position:absolute;inset:0}
.t{position:absolute;left:90px;right:60px;z-index:4}
#p1{top:1010px}
#lead{font-size:56px;color:#7a7469}
#bigwrap{position:relative;display:inline-block;font-size:140px;line-height:1.05;letter-spacing:-5px;color:#0a1150}
#mark{position:absolute;left:-12px;right:-12px;bottom:16px;height:46px;background:#00b3a0;opacity:.55;border-radius:8px;transform-origin:left}
#pill{position:absolute;left:90px;top:1330px;padding:22px 38px;border-radius:999px;background:#0a1150;color:#fff;font-size:50px;display:flex;gap:18px;align-items:center;z-index:5;transform-origin:left center;opacity:0}
#pill b{color:#00e0c6}
#p2{top:1010px;opacity:0}
#outline{position:relative;display:inline-block;font-size:300px;line-height:1;color:transparent;-webkit-text-stroke:5px #f3eee4;letter-spacing:-6px}
#strike{position:absolute;left:-30px;right:-30px;top:52%;height:22px;background:#e63946;border-radius:11px;transform-origin:left}
#sub{font-size:76px;color:#d9d4ca;letter-spacing:-2px;margin-top:10px}
#p3{top:1060px;opacity:0}
#stamp{display:inline-flex;align-items:center;gap:26px;padding:26px 46px;border:8px solid #00b3a0;border-radius:28px;font-size:112px;letter-spacing:-3px;color:#0a1150;transform:rotate(-4deg)}
#stamp svg{flex:none}
#final{font-size:96px;color:#00b3a0;margin:22px 0 0 10px}
.lbl{position:relative;display:inline-block}.lbl span{white-space:nowrap}.lbl span+span{position:absolute;left:0;top:0;opacity:0}
</style></head>
<body><div id="contraste" data-composition-id="contraste" data-width="1080" data-height="1920" data-duration="__DUR__">
<div class="paper"></div><div class="vignette"></div><div id="arcs"></div>
<div id="dark"><div class="grain"></div></div>
<div id="reveal"><div class="paper"></div><div class="vignette"></div></div>
<div class="label"><i></i><span class="lbl"><span id="l1"></span><span id="l2"></span><span id="l3"></span></span></div>
<div id="vwrap" class="vcard"><video id="vid" class="clip" src="__VIDEO__" data-start="0" data-duration="__DUR__" data-track-index="0" muted data-volume="0"></video></div>
<div id="seal"><svg class="ring" viewBox="0 0 300 300"><defs><path id="circ" d="M150 150 m-122 0 a122 122 0 1 1 244 0 a122 122 0 1 1 -244 0"/></defs>
 <circle cx="150" cy="150" r="148" fill="#fff"/><text font-family="EdLabel, Arial, sans-serif" font-weight="700" font-size="26" fill="#0a1150"><textPath id="seal-t" href="#circ" textLength="760" lengthAdjust="spacing"></textPath></text></svg>
 <div class="disc"><svg width="120" height="120" viewBox="0 0 120 120"><path d="M30 62 L52 84 L92 38" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
<div id="p1" class="t"><div id="lead" class="serif"></div><div id="bigwrap" class="sans"><div id="mark"></div><span id="big" class="wd" style="position:relative"></span></div></div>
<div id="pill" class="sans"><span id="pill-t"></span><b id="pill-b"></b></div>
<div id="p2" class="t"><div id="outline" class="serif"><span id="outline-t"></span><div id="strike"></div></div><div id="sub" class="sans"></div></div>
<div id="p3" class="t"><div id="stamp" class="sans"><svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="50" fill="#00b3a0"/><path d="M28 54 L45 71 L78 34" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="stamp-t"></span></div><div id="final" class="serif wd"></div></div>
<div id="caps" class="caps"></div>
<script>
// Contraste: claro (argumento + selo), corte seco para o negativo escuro em P&B, volta ao claro em circulo.
const S=SCENE,dur=__DUR__,$=id=>document.getElementById(id);
$('arcs').innerHTML=ED.arcs();
['l1','l2','l3'].forEach((id,i)=>$(id).textContent=S.labels[i]||'');
$('big').textContent=S.big.t;$('bigwrap').style.fontSize=ED.fit(S.big.t,140,900)+'px';
let ring=S.seal?S.seal.t.trim():'';while(ring&&ring.length<40)ring+=' '+S.seal.t.trim();$('seal-t').textContent=ring;
$('pill-t').textContent=S.pill?S.pill.t:'';$('pill-b').textContent=S.pill?S.pill.b||'':'';
$('outline-t').textContent=S.outline.t;$('outline').style.fontSize=ED.fit(S.outline.t,300,900,.55)+'px';
$('stamp-t').textContent=S.stamp.t;$('stamp').style.fontSize=ED.fit(S.stamp.t,112,760)+'px';$('final').textContent=S.final?S.final.t:'';
const tl=gsap.timeline({paused:true});
ED.spinArcs(tl,dur);
ED.focus(tl,'#vid',S.shots,CTX.sourceSize,900,700);
tl.fromTo('#vwrap',{scale:.88,y:60,opacity:0},{scale:1,y:0,opacity:1,duration:.55,ease:'back.out(1.3)'},0);
tl.fromTo('#vid',{scale:1.0},{scale:1.1,duration:S.darkAt,ease:'none'},0);
ED.cues($('lead'),S.lead,tl);
ED.blurIn(tl,'#big',S.big.at);
tl.fromTo('#mark',{scaleX:0},{scaleX:1,duration:.45,ease:'expo.out'},S.big.at+.14);
if(S.seal){tl.fromTo('#seal',{scale:2.6,rotation:-40,opacity:0},{scale:1,rotation:-8,opacity:1,duration:.3,ease:'power4.in'},S.seal.at-.15);
 tl.to('#vwrap',{x:10,y:-8,duration:.05,yoyo:true,repeat:3,ease:'none'},S.seal.at+.15);
 tl.to('#seal svg.ring',{rotation:120,duration:2.3,ease:'none'},S.seal.at+.15);}
if(S.pill)tl.fromTo('#pill',{scale:0,opacity:0},{scale:1,opacity:1,duration:.45,ease:'back.out(1.8)'},S.pill.at-.04);
const D=S.darkAt;
tl.set('#dark',{opacity:1},D);
tl.set(['#p1','#pill','#seal','.arc1','.arc2','.arc3'],{opacity:0},D);
tl.set('#vid',{filter:'grayscale(1) contrast(1.15)'},D);
tl.set('#vwrap',{rotation:-3},D);
tl.set('.label',{color:'#f3eee4'},D);tl.set('#l1',{opacity:0},D);tl.set('#l2',{opacity:1},D);
tl.set('#caps',{'--cw':'#d9d4ca','--ck':'#00e0c6'},D);
tl.set('#p2',{opacity:1},D);
tl.fromTo('#outline',{scale:1.6,opacity:0,filter:'blur(18px)'},{scale:1,opacity:1,filter:'blur(0px)',duration:.32,ease:'power4.in'},S.outline.at-.06);
ED.cues($('sub'),S.sub,tl);
tl.fromTo('#strike',{scaleX:0,rotation:-6},{scaleX:1,rotation:-6,duration:.3,ease:'power3.out'},S.strikeAt);
tl.to('#outline',{x:-14,duration:.04,yoyo:true,repeat:5,ease:'none'},S.strikeAt+.21);
const L=S.lightAt;
tl.set('#p2',{opacity:0},L);
tl.to('#reveal',{clipPath:'circle(150% at 50% 38%)',duration:.38,ease:'expo.in'},L-.05);
tl.set('#dark',{opacity:0},L+.33);
tl.set('#vid',{filter:'grayscale(0) contrast(1)'},L);
tl.to('#vwrap',{rotation:0,duration:.4,ease:'back.out(1.5)'},L);
tl.set('.label',{color:'#0a1150'},L+.3);tl.set('#l2',{opacity:0},L+.3);tl.set('#l3',{opacity:1},L+.3);
tl.set('#caps',{'--cw':'#7a7469','--ck':'#0a1150'},L+.3);
tl.set('#p3',{opacity:1},L);
tl.fromTo('#stamp',{scale:2.4,opacity:0,rotation:-16},{scale:1,opacity:1,rotation:-4,duration:.3,ease:'power4.in'},S.stamp.at-.07);
if(S.final)ED.blurIn(tl,'#final',S.final.at);
ED.captions(tl,$('caps'),S.words);
window.__timelines=window.__timelines||{};window.__timelines.contraste=tl;
</script></div></body></html>
