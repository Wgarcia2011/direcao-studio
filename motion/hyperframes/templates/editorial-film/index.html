<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Editorial Film — Direção Studio</title>
<script src="gsap.min.js"></script>
<style>/*STYLE*/</style>
</head><body>
<main id="editorial-film" data-composition-id="editorial-film" data-width="WIDTH" data-height="HEIGHT" data-fps="FPS" data-duration="DURATION">
  <canvas id="picture" class="clip" data-start="0" data-duration="DURATION" data-track-index="0" data-label="Imagem e película" width="1080" height="1920"></canvas>
  <div id="design-plane">
    <div class="folio"><span id="brand"></span><span id="edition">EF—01</span></div>
    <div id="type-track" class="clip plane" data-start="0" data-duration="DURATION" data-track-index="1" data-label="Tipografia"></div>
    <div id="caption-track" class="clip plane" data-start="0" data-duration="DURATION" data-track-index="2" data-label="Legendas"></div>
    <div class="bottom"><span id="footer"></span><span id="counter"></span></div>
    <div class="progress"><div id="progress-fill"></div></div>
  </div>
</main>
<script>window.EDITORIAL_CONFIG = /*CONFIG*/;</script>
<script src="editorial.bundle.js"></script>
<script>
window.__timelines = window.__timelines || {};
window.editorialReady.then(function () {
  const tl = gsap.timeline({paused: true});
  tl.fromTo('#progress-fill', {scaleX: 0}, {scaleX: 1, duration: DURATION, ease: 'none'}, 0);
  window.__timelines['editorial-film'] = tl;
  window.__hfForceTimelineRebind?.();
});
</script>
</body></html>
